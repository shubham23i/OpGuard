artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_data_dir: artifacts/data/ServerMachineDataset
  ingested_data_dir: artifacts/data_ingestion/ServerMachineDataset

data_validation:
  root_dir: artifacts/data_validation
  status_file: artifacts/data_validation/status.txt
  data_dir: artifacts/data_ingestion/ServerMachineDataset
  expected_machine_count: 28
  expected_feature_count: 38

data_preprocessing:
  root_dir: artifacts/data_preprocessing
  input_data_dir: artifacts/data_ingestion/ServerMachineDataset
  processed_data_dir: artifacts/data_preprocessing/processed
  scaler_dir: artifacts/data_preprocessing/scalers

temporal_windowing:
  root_dir: artifacts/temporal_windowing
  input_data_dir: artifacts/data_preprocessing/processed
  output_data_dir: artifacts/temporal_windowing/windows
  window_size: 60
  stride: 1

label_alignment:
  root_dir: artifacts/label_alignment
  input_window_dir: artifacts/temporal_windowing/windows
  input_label_dir: artifacts/data_ingestion/ServerMachineDataset/test_label
  output_dir: artifacts/label_alignment/labels
  window_size: 60
  anomaly_rule: any
  
feature_engineering:
  root_dir: artifacts/feature_engineering
  input_data_dir: artifacts/temporal_windowing/windows
  output_data_dir: artifacts/feature_engineering/features
  window_size: 60
  rolling_windows:
    - 5
    - 15
    - 30

baseline_detection:
  root_dir: artifacts/baseline_detection
  input_data_dir: artifacts/feature_engineering/features
  output_data_dir: artifacts/baseline_detection/predictions
  model_dir: artifacts/baseline_detection/models
  contamination: 0.01
  random_state: 42

anomaly_detection:
  root_dir: artifacts/anomaly_detection
  input_data_dir: artifacts/temporal_windowing/windows
  model_dir: artifacts/anomaly_detection/models
  score_dir: artifacts/anomaly_detection/scores
  hidden_size: 64
  latent_size: 16
  num_layers: 1
  dropout: 0.0
  learning_rate: 0.001
  batch_size: 256
  epochs: 20
  patience: 5
  random_state: 42

threshold_manager:
  root_dir: artifacts/threshold_manager
  input_score_dir: artifacts/anomaly_detection/scores
  output_prediction_dir: artifacts/threshold_manager/predictions
  threshold_method: percentile
  percentile: 99.0

event_correlator:
  root_dir: artifacts/event_correlator
  correlation_window: 10
  minimum_persistence: 5

root_cause:
  root_dir: artifacts/root_cause
  top_k: 5

uncertainty:
  root_dir: artifacts/uncertainty
  calibration_method: isotonic

drift_detection:
  root_dir: artifacts/drift_detection
  method: psi
  threshold: 0.2

model_evaluation:
  root_dir: artifacts/model_evaluation
  report_file: artifacts/model_evaluation/report.json

model_registry:
  root_dir: artifacts/model_registry

prediction:
  root_dir: artifacts/prediction
  prediction_file: artifacts/prediction/prediction.json